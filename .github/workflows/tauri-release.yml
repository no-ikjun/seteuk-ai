name: Release 세특척척 for Windows and macOS

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate tagged source
    runs-on: macos-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install locked dependencies
        run: npm ci

      - name: Verify tag and application versions
        id: version
        run: npm run release:verify -- --tag "$GITHUB_REF_NAME"

      - name: Ensure signing material is not tracked
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '\.(p12|cer|p8|mobileprovision|keychain-db)$|certificate-base64\.txt$'; then
            echo "Signing material must not be committed to the repository." >&2
            exit 1
          fi
          private_key_marker='BEGIN PRIVATE'
          private_key_marker+=' KEY'
          certificate_marker='BEGIN CERT'
          certificate_marker+='IFICATE'
          if git grep -I -n -E "$private_key_marker|$certificate_marker" -- .; then
            echo "A private key or certificate block appears to be tracked." >&2
            exit 1
          fi

      - name: Run release checks
        run: |
          npm run lint
          npm test
          npm run build
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo test --locked --manifest-path src-tauri/Cargo.toml
          cargo check --locked --manifest-path src-tauri/Cargo.toml
          npm audit --omit=dev --audit-level=high

  build-windows:
    name: Build Windows x64 installers
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install locked dependencies
        run: npm ci

      - name: Build NSIS and MSI installers
        run: npm run tauri -- build --bundles nsis,msi

      - name: Collect and checksum Windows installers
        shell: pwsh
        run: |
          $bundleRoot = Join-Path $PWD "src-tauri/target/release/bundle"
          $installers = @(
            Get-ChildItem (Join-Path $bundleRoot "nsis") -Filter *.exe -File -ErrorAction SilentlyContinue
            Get-ChildItem (Join-Path $bundleRoot "msi") -Filter *.msi -File -ErrorAction SilentlyContinue
          )
          if ($installers.Count -ne 2) {
            throw "Expected one NSIS installer and one MSI installer, found $($installers.Count)."
          }

          $assetDir = Join-Path $env:RUNNER_TEMP "windows-assets"
          New-Item -ItemType Directory -Force -Path $assetDir | Out-Null
          foreach ($installer in $installers) {
            $destination = Join-Path $assetDir $installer.Name
            Copy-Item $installer.FullName $destination
            $hash = (Get-FileHash -Algorithm SHA256 -Path $destination).Hash.ToLowerInvariant()
            $checksum = "$hash  $($installer.Name)`n"
            [System.IO.File]::WriteAllText(
              "$destination.sha256",
              $checksum,
              [System.Text.UTF8Encoding]::new($false)
            )
          }

      - name: Upload Windows release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: ${{ runner.temp }}/windows-assets/*
          if-no-files-found: error
          retention-days: 7

  build-macos:
    name: Build signed and notarized macOS Apple Silicon DMG
    needs: validate
    runs-on: macos-latest
    environment: macos-release
    timeout-minutes: 60

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install locked dependencies
        run: npm ci

      - name: Validate macOS release secrets
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PRIVATE: ${{ secrets.APPLE_API_KEY_PRIVATE }}
        run: |
          set -euo pipefail
          required=(
            APPLE_CERTIFICATE
            APPLE_CERTIFICATE_PASSWORD
            KEYCHAIN_PASSWORD
            APPLE_API_ISSUER
            APPLE_API_KEY
            APPLE_API_KEY_PRIVATE
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required macos-release secret is missing: $name" >&2
              exit 1
            fi
          done

      - name: Import Developer ID certificate
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_path="$RUNNER_TEMP/seteuk-release.keychain-db"

          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          signing_identity="$(
            security find-identity -v -p codesigning "$keychain_path" \
              | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' \
              | head -n 1
          )"
          if [[ -z "$signing_identity" ]]; then
            echo "Developer ID Application identity was not found." >&2
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$signing_identity" >> "$GITHUB_ENV"

      - name: Prepare App Store Connect API key
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PRIVATE: ${{ secrets.APPLE_API_KEY_PRIVATE }}
        run: |
          set -euo pipefail
          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_KEY_PRIVATE" | base64 --decode > "$api_key_path"
          chmod 600 "$api_key_path"
          echo "APPLE_API_KEY_PATH=$api_key_path" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, and staple app
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: >-
          npm run tauri -- build
          --bundles app
          --target aarch64-apple-darwin

      # Tauri의 DMG 번들러는 CI 환경 변수를 보면 bundle_dmg.sh에
      # --skip-jenkins를 붙여 배경과 아이콘 배치를 넣는 단계를 건너뛴다.
      # appdmg는 Finder를 거치지 않고 .DS_Store를 직접 써서 CI에서도 같은
      # 결과를 낸다. 자세한 사정은 scripts/make-dmg.mjs 주석에 있다.
      - name: Build styled DMG
        shell: bash
        run: |
          set -euo pipefail
          node scripts/make-dmg.mjs \
            --target aarch64-apple-darwin \
            --identity "$APPLE_SIGNING_IDENTITY"

      - name: Notarize and staple DMG
        shell: bash
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          # 번들 이름은 tauri.conf.json의 productName에서 온다. 여기에 이름을
          # 적어 두면 앱 이름을 바꿀 때마다 이 워크플로가 조용히 어긋난다.
          product_name="$(jq -r .productName src-tauri/tauri.conf.json)"
          dmg_path="src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/${product_name}_${{ needs.validate.outputs.version }}_aarch64.dmg"

          test -f "$dmg_path"
          xcrun notarytool submit "$dmg_path" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$dmg_path"

      - name: Verify and checksum macOS bundles
        shell: bash
        run: |
          set -euo pipefail
          bundle_root="src-tauri/target/aarch64-apple-darwin/release/bundle"
          product_name="$(jq -r .productName src-tauri/tauri.conf.json)"
          app_path="$bundle_root/macos/${product_name}.app"
          dmg_path="$bundle_root/dmg/${product_name}_${{ needs.validate.outputs.version }}_aarch64.dmg"

          test -d "$app_path"
          test -f "$dmg_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          codesign -dv --verbose=4 "$app_path" 2>&1 \
            | grep -F "Authority=Developer ID Application"
          spctl --assess --type execute --verbose=4 "$app_path"
          xcrun stapler validate "$app_path"
          codesign --verify --verbose=2 "$dmg_path"
          xcrun stapler validate "$dmg_path"
          hdiutil verify "$dmg_path"

          asset_dir="$RUNNER_TEMP/macos-assets"
          mkdir -p "$asset_dir"
          cp "$dmg_path" "$asset_dir/"
          dmg_name="$(basename "$dmg_path")"
          (
            cd "$asset_dir"
            shasum -a 256 "$dmg_name" > "$dmg_name.sha256"
          )

      - name: Upload macOS release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-apple-silicon
          path: ${{ runner.temp }}/macos-assets/*
          if-no-files-found: error
          retention-days: 7

      - name: Clean temporary signing material
        if: always()
        shell: bash
        run: |
          keychain_path="$RUNNER_TEMP/seteuk-release.keychain-db"
          if [[ -f "$keychain_path" ]]; then
            security delete-keychain "$keychain_path" || true
          fi
          rm -f \
            "$RUNNER_TEMP/developer-id.p12" \
            "$RUNNER_TEMP"/AuthKey_*.p8

  publish-release:
    name: Publish combined desktop release
    needs:
      - validate
      - build-windows
      - build-macos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.validate.outputs.version }}

    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Verify combined asset set
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmg=(release-assets/*.dmg)
          exe=(release-assets/*.exe)
          msi=(release-assets/*.msi)
          checksums=(release-assets/*.sha256)

          if (( ${#dmg[@]} != 1 || ${#exe[@]} != 1 || ${#msi[@]} != 1 || ${#checksums[@]} != 3 )); then
            echo "Expected one DMG, one EXE, one MSI, and three checksum files." >&2
            find release-assets -maxdepth 1 -type f -print >&2
            exit 1
          fi

          (
            cd release-assets
            for checksum in *.sha256; do
              shasum -a 256 -c "$checksum"
            done
          )

      - name: Create or reuse draft release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft > "$RUNNER_TEMP/is-draft" 2>/dev/null; then
            if [[ "$(cat "$RUNNER_TEMP/is-draft")" != "true" ]]; then
              echo "A published release already exists for $GITHUB_REF_NAME." >&2
              exit 1
            fi
          else
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --verify-tag \
              --generate-notes \
              --title "세특척척 $VERSION" \
              --notes "Windows 10/11 x64 설치 파일과 macOS 12 이상 Apple Silicon용 서명·공증 DMG입니다. 각 파일의 SHA-256 체크섬을 함께 제공합니다."
          fi

      - name: Upload verified release assets
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' assets < <(find release-assets -maxdepth 1 -type f -print0)
          gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber

      - name: Publish release
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
